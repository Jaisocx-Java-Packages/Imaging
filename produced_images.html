  <style name="clean_start_overrides">

    .jsx {
      --jsx--css-clean-start-2--rem: 16px;

      --jsx--css-clean-start-2--h1--margin: 1rem 0;

      --jaisocx-ts-pack-label--font-size: 0.79rem;

      --image-size: 4rem;
    }

    html.jsx label {
      border: 1px solid lime;
      background: #efe;
      color: green;
      border-radius: 0.4rem;

      font-size: var(--jaisocx-ts-pack-label--font-size);
      line-height: var(--jaisocx-ts-pack-label--font-size);
      letter-spacing: 0.04rem;

      padding: 0.14rem 0.6rem 0.14rem 0.6rem;
    }

    html.jsx produced_images.images.big {
      --image-size: 6rem;
    }

    html.jsx produced_images.images.little {
      --image-size: 2rem;
    }

    html.jsx produced_images.images {
      display: inline-block;

      height: auto;

      min-width: 1px;
      max-width: 100%;
      width: auto;

      font-size: 0;
      line-height: 0;
    }

    html.jsx produced_images.images item_image {
      display: inline-block;
      text-align: center;

      height: var(--image-size);
      width: var(--image-size);

      border: 1px solid #efe;

      overflow: hidden hidden;

      margin-bottom: 0.4rem;
    }

    html.jsx produced_images.images item_image img {
      display: inline-block;

      min-height: 1px;
      max-height: 100%;
      height: auto;

      min-width: 1px;
      max-width: 100%;
      width: auto;

      border: 1px solid lime;

      overflow: hidden hidden;
    }

  </style>
