  />



  <!--# STYLES CssCleanStart_Lite and theme_base -->
  <link
      rel="stylesheet"
      type="text/css"
      charset="utf-8"
      href="../node_cdn_installs/node_modules/@jaisocx/css_clean_start_lite/MediaAndStyles/CssCleanStart_Lite_main_resolved.css"
  />



  <style name="clean_start_overrides">

    .jsx {
      --jsx--css-clean-start-2--rem: 14px;

      --jsx--css-clean-start-2--site--min-width: 93%;
      --jsx--css-clean-start-2--site--width: 93%;

      --jsx--css-clean-start-2--site--background: white;

      --jsx--css-clean-start-2--h1--font-size: 1.05rem;
      --jsx--css-clean-start-2--h1--margin: 1rem 0;

      --jaisocx-ts-pack-label--font-size: 0.79rem;

      --image-size: 5rem;
    }

    html.jsx label {
      border: 1px solid lime;
      background: #efe;
      color: green;
      border-radius: 0.4rem;

      font-size: var(--jaisocx-ts-pack-label--font-size);
      line-height: var(--jaisocx-ts-pack-label--font-size);
      letter-spacing: 0.05rem;

      padding: 0.14rem 0.6rem 0.14rem 0.6rem;
    }

    html.jsx produced_images.images.big {
      --image-size: fit-content;
    }

    html.jsx produced_images.images.little {
      --image-size: 5rem;
    }

    html.jsx produced_images.images {
      display: inline-block;

      height: auto;

      min-width: 1px;
      max-width: 100%;
      width: auto;

      font-size: 0;
      line-height: 0;

      background: white;
    }

    html.jsx produced_images.images item_image {
      display: inline-block;
      text-align: center;

      width: var(--image-size);
      height: fit-content;

      border: 1px solid navy;
      background: white;

      overflow: hidden hidden;

      margin: 1rem 1rem 1rem 1rem;
    }

    html.jsx produced_images.images item_image img {
      display: inline-block;

      min-height: 1px;
      max-height: 100%;
      height: auto;

      min-width: 1px;
      max-width: 100%;
      width: 100%;

      /* border: 1px dashed black; */
      border-width: 0;

      overflow: hidden hidden;
    }

  </style>

  <head>
