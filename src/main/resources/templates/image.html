
<item_image>
  <img title="{{ nameOf_ProducedImage_to }}"
      data-x="{{ x }}"
      data-y="{{ y }}"
      data-h="{{ h }}"
      data-w="{{ w }}"
      src="file://{{ abs_pathOf_ProducedImage_to }}"
      onerror="javascript: ( () => { this.style.display = 'none'; this.onerror = null; } )();"
  />
</item_image>
